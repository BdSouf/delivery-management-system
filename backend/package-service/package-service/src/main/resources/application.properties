server.port=${SERVER_PORT:8094}
spring.application.name=package-service

# MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/package_db?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

jwt.secret=${JWT_SECRET:dev-only-change-me-before-docker}
internal.api.key=${INTERNAL_API_KEY:dev-internal-key}

user.service.url=${USER_SERVICE_URL:http://user-service}
courier.service.url=${COURIER_SERVICE_URL:http://courier-service}
