server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

jwt.secret=${JWT_SECRET:dev-only-change-me-before-docker}

# Logs
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.http.server.reactive=DEBUG

# ===== ROUTES (public API only — /internal/** is NOT exposed) =====

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[2].id=client-service
spring.cloud.gateway.routes[2].uri=lb://client-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/clients/**

spring.cloud.gateway.routes[3].id=courier-service
spring.cloud.gateway.routes[3].uri=lb://courier-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/couriers/**

spring.cloud.gateway.routes[4].id=package-service
spring.cloud.gateway.routes[4].uri=lb://package-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/packages/**

# ===== CORS =====
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:*}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

spring.main.web-application-type=reactive

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

server.forward-headers-strategy=framework
