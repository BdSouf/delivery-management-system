server.port=8080
spring.application.name=api-gateway

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Logs
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.http.server.reactive=DEBUG


# ===== ROUTES =====


# Route vers AUTH-SERVICE
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**


# Route vers USER-SERVICE
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

# Route vers CLIENT-SERVICE
spring.cloud.gateway.routes[2].id=client-service
spring.cloud.gateway.routes[2].uri=lb://client-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/clients/**

# Courier-Service
spring.cloud.gateway.routes[3].id=courier-service
spring.cloud.gateway.routes[3].uri=lb://courier-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/couriers/**

# INTERNAL (OBLIGATOIRE POUR approve)
spring.cloud.gateway.routes[4].id=auth-internal
spring.cloud.gateway.routes[4].uri=lb://auth-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/internal/**

# PACKAGE-SERVICE
spring.cloud.gateway.routes[5].id=package-service
spring.cloud.gateway.routes[5].uri=lb://package-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/packages/**



# ===== CORS =====
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

spring.main.web-application-type=reactive

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

server.forward-headers-strategy=framework






