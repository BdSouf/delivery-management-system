server.port=${SERVER_PORT:8093}
spring.application.name=courier-service

# MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/courierdb}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Inter-service (Eureka / Docker DNS name — requires @LoadBalanced RestTemplate)
auth.service.url=${AUTH_SERVICE_URL:http://auth-service}

jwt.secret=${JWT_SECRET:dev-only-change-me-before-docker}
internal.api.key=${INTERNAL_API_KEY:dev-internal-key}
