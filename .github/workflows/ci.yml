# E5 — Continuous Integration
# Build backend (matrix 8 services) + frontend Next.js on every push/PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - auth-service
          - user-service
          - client-service
          - courier-service
          - package-service
          - api-gateway
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/${{ matrix.service }}/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Package (skip tests — no MySQL in CI)
        run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend — Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/delivery-app-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/delivery-app-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
